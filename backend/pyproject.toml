[project]
name = "capflow"
version = "0.1.0"
description = "股市资金流向监控系统"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "apscheduler>=3.10",
    "redis>=5.0",
    "httpx>=0.26",
    "pandas>=2.2",
    "numpy>=1.26",
    "akshare>=1.12",
    "efinance>=0.5",
    "pydantic-settings>=2.2",
    "python-multipart>=0.0.9",
    "websockets>=12.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
