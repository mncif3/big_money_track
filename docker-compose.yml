version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: capflow-postgres
    environment:
      POSTGRES_DB: capflow
      POSTGRES_USER: capflow
      POSTGRES_PASSWORD: ${PG_PASSWORD}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U capflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: capflow-redis
    volumes:
      - ./data/redis:/data
    restart: unless-stopped

  proxy_pool:
    image: jhao104/proxy_pool:latest
    container_name: capflow-proxy
    environment:
      DB_CONN: "redis://:@redis:6379/0"
    depends_on: [redis]
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: capflow-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+asyncpg://capflow:${PG_PASSWORD}@postgres:5432/capflow
      REDIS_URL: redis://redis:6379/0
      PROXY_POOL_URL: http://proxy_pool:5010
      FEISHU_WEBHOOK: ${FEISHU_WEBHOOK}
      TZ: Asia/Shanghai
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: capflow-frontend
    restart: unless-stopped

  nginx:
    image: nginx:1.25-alpine
    container_name: capflow-nginx
    ports:
      - "6666:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on: [backend, frontend]
    restart: unless-stopped
